# Cabeceras de seguridad (OWASP ASVS 4.0.3, V14.4). Se incluye en cada "location" porque
# en nginx un add_header dentro de un location anula los heredados del bloque server.
# __API_ORIGIN__ se reemplaza en el build con el origen de VITE_API_URL.

# V14.4.3 Content-Security-Policy. Los scripts en línea de las plantillas de impresión se
# autorizan uno a uno por hash ($csp_script_hashes, generado en el build).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-hashes' $csp_script_hashes; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: __API_ORIGIN__ https://images.unsplash.com; connect-src 'self' __API_ORIGIN__; font-src 'self' data:; frame-src 'self' blob: data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

# V9.1.1 / V14.4.5 HSTS
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# V14.4.4 sin "sniffing" de tipos MIME
add_header X-Content-Type-Options "nosniff" always;
# V14.4.7 no permitir que otros sitios incrusten la aplicación (clickjacking)
add_header X-Frame-Options "DENY" always;
# V14.4.6 no filtrar URLs con datos a otros sitios
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Desactivar APIs del navegador que la aplicación no usa
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
