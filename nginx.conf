server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # V14.3.3: no revelar la versión del servidor
    server_tokens off;

    # ISO/IEC 25010 — Eficiencia de desempeño: compresión (la imagen oficial de nginx la trae
    # desactivada; el JavaScript se servía sin comprimir)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;

    # Huellas de los scripts permitidos por la CSP (generado en el build)
    include /etc/nginx/snippets/csp-hashes.conf;

    # SPA: cualquier ruta de react-router devuelve index.html
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        # V8.2.1: el HTML de la aplicación no se guarda en caché
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }

    # Cache largo para los assets con hash de Vite
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
